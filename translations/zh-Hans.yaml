configuration:
  mqtt_user:
    name: MQTT 用户名
    description: >-
      与 Mosquitto 登录用户一致（不是 HA 账号）。未设用户则留空。
  mqtt_password:
    name: MQTT 密码
    description: 与上面用户名配对。未设密码则留空。
  advertise_ip:
    name: 局域网 IP（一般不用填）
    description: >-
      例如 192.168.1.210。留空自动探测；不对再手填。不要填 127.0.0.1。
  dashscope_api_key:
    name: 阿里云语音密钥（可选）
    description: >-
      不填只跑传感器。要设备语音时填百炼 API Key（sk- 开头）。
  conversation_agent:
    name: 对话代理 ID（可选覆盖）
    description: >-
      一般留空：自动读取「设置 → 语音助手」里首选流水线的对话代理。
      仅当自动读取失败时再手填，例如 conversation.xxxxx。
network:
  9080/tcp: 健康检查
  8765/tcp: 设备语音
