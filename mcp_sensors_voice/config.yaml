name: "MCP Sensors + Voice"
version: "0.4.3"
slug: mcp_sensors_voice
description: "装好 Mosquitto 和本 App 即可。传感器自动出现在 HA；语音走 Assist。不必拷自定义集成。"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
hassio_api: true
hassio_role: default
map:
  - type: addon_config
    read_only: false
ports:
  9080/tcp: 9080
  8765/tcp: 8765
ports_description:
  9080/tcp: 健康检查 /health
  8765/tcp: 设备语音 WebSocket
options:
  mqtt_user: ""
  mqtt_password: ""
  advertise_ip: ""
  dashscope_api_key: ""
  conversation_agent: ""
schema:
  mqtt_user: str?
  mqtt_password: password?
  advertise_ip: str?
  dashscope_api_key: password?
  conversation_agent: str?
